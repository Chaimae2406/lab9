
name: Basic Tests

on:
  push:
    branches:
      - main
      - test

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test 1 - Valid details
        run: |
          result=$(bash validate-data.sh Chaimae 1234567890)
          echo "Test 1: $result"
          [ "$result" = "PASS" ]

      - name: Test 2 - Name within 20 characters
        run: |
          result=$(bash validate-data.sh Chaimaeabcdefghijkl 1234567890)
          echo "Test 2: $result"
          [ "$result" = "PASS" ]

      - name: Test 3 - Invalid mobile
        run: |
          result=$(bash validate-data.sh Chaimae 12345678901)
          echo "Test 3: $result"
          [ "$result" = "FAIL" ]

